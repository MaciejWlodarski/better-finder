name: macOS build and regressions
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build native application
        run: zsh ./build_app.sh
      - name: Run isolated production-path regressions
        run: zsh ./scripts/run_tests.sh
      - name: Run direct-delegate live terminal integration
        run: zsh ./scripts/run_terminal_live_integration.sh
